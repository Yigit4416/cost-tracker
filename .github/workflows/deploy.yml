name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload app to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "backend,frontend,package.json,bun.lock,tsconfig.json,Dockerfile,docker-compose.yml,Caddyfile,.dockerignore,.env.example"
          target: ${{ secrets.EC2_APP_DIR || format('/home/{0}/tracker', secrets.EC2_USER) }}

      - name: Restart Docker Compose on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.EC2_APP_DIR }}"

            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/tracker"
            fi

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            docker compose up -d --build --remove-orphans
            docker image prune -f
